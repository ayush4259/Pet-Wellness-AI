<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signed In - PetHealth Campaign</title>
  <style>
    /* General Styling */
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #6a1b9a;
      padding: 20px;
      text-align: center;
      color: white;
    }

    header h1 {
      font-size: 2.5rem;
      margin: 0;
    }

    /* Success Page Styling */
    .success-container {
      max-width: 600px;
      margin: 50px auto;
      padding: 40px;
      background-color: #fff;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    .success-container h2 {
      font-size: 2rem;
      color: #4caf50;
      margin-bottom: 20px;
    }

    .success-container .tick {
      font-size: 4rem;
      color: #4caf50;
    }

    .success-container p {
      font-size: 1.2rem;
      color: #333;
    }
  </style>
</head>
<body>

  <header>
    <h1>PetHealth Campaign - Success</h1>
  </header>

  <!-- Success Page Content -->
  <div class="success-container">
    <h2>You are ready to go!</h2>
    <div class="tick">✔️</div>
    <p>Thank you for signing up. You can now access all of our services. Welcome to PetHealth Campaign!</p>
  </div>

</body>
</html>
