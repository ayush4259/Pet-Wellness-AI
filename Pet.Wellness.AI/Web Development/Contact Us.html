<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | PetWellness AI</title>
  <link href="look.css" rel="stylesheet">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    header {
      background-color: #6a1b9a;
      color: #fff;
      padding: 20px;
      text-align: center;
    }

    h1 {
      margin: 0;
    }

    .container {
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
      background-color: #fff;
      border-radius: 8px;
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
    }

    .section-title {
      font-size: 32px;
      color: #6a1b9a;
      text-align: center;
      margin-bottom: 30px;
    }

    .contact-info {
      text-align: center;
      font-size: 18px;
      margin-bottom: 40px;
    }

    .contact-info p {
      margin: 10px 0;
    }

    .contact-form input, .contact-form textarea {
      width: 100%;
      padding: 15px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 16px;
      box-sizing: border-box;
    }

    .contact-form button {
      background-color: #6a1b9a;
      color: #fff;
      padding: 15px 25px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      transition: background-color 0.3s ease;
    }

    .contact-form button:hover {
      background-color: #4e1482;
    }

    .social-icons {
      text-align: center;
      margin-top: 30px;
    }

    .social-icons a {
      margin: 0 15px;
      color: #6a1b9a;
      font-size: 24px;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .social-icons a:hover {
      color: #340c84;
    }
  </style>
</head>
<body>

  <header>
    <h1>Contact PetHealth Campaign</h1>
  </header>

  <div class="container">
    <h2 class="section-title">Get in Touch</h2>

    <div class="contact-info">
      <p>Have a question or need assistance? We're here to help! Reach out to us using the form below or through the contact details provided.</p>
      <p><strong>Email:</strong> support@Pethealthcampign</p>
      <p><strong>Phone:</strong> +1 (800) 123-4567</p>
    </div>

    <div class="contact-form">
      <h3>Contact Form</h3>
      <form action="#" method="post">
        <input type="text" name="name" placeholder="Your Name" required>
        <input type="email" name="email" placeholder="Your Email" required>
        <textarea name="message" rows="5" placeholder="Your Message" required></textarea>
        <button type="submit">Send Message</button>
      </form>
    </div>



    <div class="social-icons">
      <h4>Follow Us</h4>


      
      <a href="#" target="_blank" class="fab fa-facebook">Facebook</a>
      <a href="#" target="_blank" class="fab fa-twitter">Twitter</a>
      <a href="#" target="_blank" class="fab fa-instagram">Instagram</a>
      <a href="#" target="_blank" class="fab fa-linkedin">LinkedIn</a>
    </div>
  </div>

</body>
</html>
