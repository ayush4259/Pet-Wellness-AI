<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PetHealth Campaign - Registration</title>
  <link href="Signed In.html" rel="stylesheet">
  <style>
    /* General Styling */
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #6a1b9a;
      padding: 20px;
      text-align: center;
      color: white;
    }

    header h1 {
      font-size: 2.5rem;
      margin: 0;
    }

    /* Form Container Styling */
    .form-container {
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      background-color: #fff;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
      font-size: 2rem;
      color: #6a1b9a;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      font-size: 1.1rem;
      display: block;
      margin-bottom: 5px;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      margin-top: 5px;
    }

    .form-group input:focus {
      outline-color: #9c27b0;
    }

    .form-button {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
    }

    .form-button button {
      width: 48%;
      padding: 12px;
      background-color: #9c27b0;
      color: white;
      font-size: 1.1rem;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .form-button button:hover {
      background-color: #7b1fa2;
    }

    .form-footer {
      text-align: center;
      margin-top: 20px;
    }

    .form-footer a {
      color: #9c27b0;
      text-decoration: none;
      font-weight: bold;
    }

    .form-footer a:hover {
      color: #6a1b9a;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .form-container {
        margin: 20px;
        padding: 15px;
      }

      .form-button button {
        width: 100%;
        margin-bottom: 10px;
      }

      .form-footer a {
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>PetHealth Campaign - Registration</h1>
  </header>

  <!-- Registration Form -->
  <div class="form-container">
    <h2>Sign Up for PetHealth Campaign</h2>

    <form action="Signed In.html" method="POST">
      <!-- Name Field -->
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" required placeholder="Enter your full name">
      </div>

      <!-- Email Field -->
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required placeholder="Enter your email address">
      </div>

      <!-- Phone Number Field -->
      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" required placeholder="Enter your phone number">
      </div>

      <!-- Address Field -->
      <div class="form-group">
        <label for="address">Address</label>
        <input type="text" id="address" name="address" required placeholder="Enter your address">
      </div>

      <!-- Form Buttons -->
      <div class="form-button">
        <button type="submit">Sign Up</button>
        <button type="button" onclick="window.location.href='login.html'">Log In</button>
      </div>
    </form>

    <!-- Footer Text -->
    <div class="form-footer">
      <p>Already have an account? <a href="login.html">Log In here</a></p>
    </div>
  </div>

</body>
</html>
